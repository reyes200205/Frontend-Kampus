name: CI

# Revisa que la app compile sin errores de tipos en cada push y PR a develop o main.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Tipos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        # Toma la versión de pnpm del campo packageManager de package.json.
        uses: pnpm/action-setup@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Expo genera expo-env.d.ts (tipos de los .css, imágenes, etc.) al arrancar y no se sube al repositorio.
      - name: Preparar los tipos de Expo
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts

      - name: Revisar los tipos
        run: pnpm typecheck
